on:
  issues:
    types: [opened, reopened]

# default to nothing; the one job that needs a scope grants it to itself below
permissions: {}

jobs:
  check:
    if: github.event.issue.user.login != 'zandbelt'
    runs-on: ubuntu-latest
    # labelling and closing the issue is the only write this workflow performs;
    # it does not check out the repository, so it needs no contents access
    permissions:
      issues: write
    steps: 
      - if: github.event.action == 'opened'
        # third-party actions are pinned by commit SHA: a tag is mutable, so a
        # compromised upstream account could repoint v1 at arbitrary code that
        # would then run with this job's issues:write token
        uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1
        name: Label Invalid
        with:
          labels: invalid
      - uses: peter-evans/close-issue@1373cadf1f0c96c1420bc000cfba2273ea307fd1 # v2
        name: Close Issue
        with:
          comment: "https://github.com/OpenIDC/mod_auth_openidc/wiki#20-why-is-my-ticket-closed-as-invalid"
 
